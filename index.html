<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>حاسبة 😼</title>
<style>
  body{background:#111;height:100vh;margin:0;display:flex;justify-content:center;align-items:center;font-family:sans-serif;color:#fff}
  .box{background:#1e1e1e;width:340px;max-width:94vw;padding:16px;border-radius:20px;text-align:center}
  #history{width:100%;min-height:22px;opacity:.75;text-align:right;margin:6px 0;font-size:14px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
  #screen{width:100%;height:70px;border:none;outline:none;border-radius:12px;margin:8px 0 12px;font-size:26px;text-align:right;padding:10px;box-sizing:border-box;background:#fff;color:#000}
  .buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  button{height:56px;border:none;border-radius:15px;font-size:19px;background:#333;color:#fff;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button:active{transform:scale(.98)}
  .wide{grid-column:span 2}
  .topbar{display:flex;gap:8px;justify-content:space-between;align-items:center;margin-bottom:6px}
  .chip{background:#2b2b2b;padding:8px 10px;border-radius:12px;font-size:13px;flex:1;text-align:right}
  .mini{background:#444;padding:8px 10px;border-radius:12px;font-size:13px}
  .hidden{display:none}
</style>
</head>
<body>

<div class="box">

  <div id="choose">
    <h3 style="margin:0 0 10px;">هل انت؟ 👀</h3>
    <button class="wide" onclick="selectPerson('ali')">علي</button>
    <button class="wide" onclick="selectPerson('younis')">يونس</button>
  </div>

  <div id="calc" class="hidden">
    <div class="topbar">
      <div class="chip" id="who">المستخدم: -</div>
      <button class="mini" onclick="toggleSound()" id="soundBtn">🔊</button>
      <button class="mini" onclick="copyText()">📋</button>
      <button class="mini" onclick="resetPerson()">🔁</button>
    </div>

    <div id="history"></div>
    <input type="text" id="screen" readonly />

    <div class="buttons">
      <button onclick="clearAll()">AC</button>
      <button onclick="backspace()">⌫</button>
      <button onclick="toggleSign()">+/−</button>
      <button onclick="addOp('/')">÷</button>

      <button onclick="add('7')">7</button>
      <button onclick="add('8')">8</button>
      <button onclick="add('9')">9</button>
      <button onclick="addOp('*')">×</button>

      <button onclick="add('4')">4</button>
      <button onclick="add('5')">5</button>
      <button onclick="add('6')">6</button>
      <button onclick="addOp('-')">-</button>

      <button onclick="add('1')">1</button>
      <button onclick="add('2')">2</button>
      <button onclick="add('3')">3</button>
      <button onclick="addOp('+')">+</button>

      <button onclick="percent()">%</button>
      <button onclick="add('0')">0</button>
      <button onclick="add('.')">.</button>
      <button onclick="calculate()">=</button>
    </div>
  </div>
</div>

<script>
const screen = document.getElementById("screen");
const historyBox = document.getElementById("history");

let person = "";
let internalExpr = "";   // للـ حساب
let displayExpr  = "";   // للعرض (× ÷)
let soundOn = true;
let audioCtx = null;

// رسائل
const msgAli    = "شوكت تشتريلي البيسي؟ ❤️🫵";
const msgYounis = "حببي نته ❤️🫵";
const msgMul    = "الضرب عمره مكان حل ☹️😔";

const msgAdd = "خوش جمع 😎✨";
const msgDiv = "لا تقسم رزقي 🥹😣";
const msgSub = "شلابس؟ 🫦😉"; // خففتها شوية حتى تبقى مزحة

const secretMsg = "ونعم منك 🫡👑";

// ========= صوت كلك =========
function playClick(){
  if(!soundOn) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "square";
    o.frequency.value = 700;
    g.gain.value = 0.03;
    o.connect(g); g.connect(audioCtx.destination);
    o.start();
    o.stop(audioCtx.currentTime + 0.04);
  }catch(e){}
}
function toggleSound(){
  soundOn = !soundOn;
  document.getElementById("soundBtn").textContent = soundOn ? "🔊" : "🔇";
  playClick();
}

// ========= مساعدات =========
function vibe(ms=60){ if(navigator.vibrate) navigator.vibrate(ms); }

function refreshScreen(){ screen.value = displayExpr; }

function sanitizeExpr(expr){
  // يسمح فقط: أرقام + . + عمليات + - * / + أقواس
  if(!/^[0-9+\-*/().\s]*$/.test(expr)) return null;
  // يمنع تكرار عمليات بشكل يسبب مشاكل (بسيطة)
  if(/[\+\*\/]{2,}/.test(expr)) return null;
  return expr.replace(/\s+/g,'');
}

function safeCalc(expr){
  const clean = sanitizeExpr(expr);
  if(clean === null) throw new Error("bad");
  // Function بعد فلترة قوية (آمن عملياً لهالحالة)
  return Function("return (" + clean + ");")();
}

function formatNumber(n){
  if(!isFinite(n)) return "خطأ 👀";
  // إذا طويل، قصّه
  const s = String(n);
  if(s.length <= 12) return s;
  // صيغة علمية لطيفة
  return Number(n).toExponential(4);
}

function hasRealSubtraction(expr){ return /[0-9)]\-[0-9(]/.test(expr); }
function hasAddition(expr){ return /[0-9)]\+[0-9(]/.test(expr); }
function hasDivision(expr){ return /[0-9)]\/[0-9(]/.test(expr); }

// ========= اختيار شخص =========
function selectPerson(name){
  person = name;
  document.getElementById("choose").classList.add("hidden");
  document.getElementById("calc").classList.remove("hidden");
  document.getElementById("who").textContent = "المستخدم: " + (name==="ali" ? "علي" : "يونس");
  clearAll();
  playClick();
}
function resetPerson(){
  playClick();
  person = "";
  document.getElementById("calc").classList.add("hidden");
  document.getElementById("choose").classList.remove("hidden");
  clearAll();
}

// ========= إدخال =========
function add(val){
  playClick();

  if(val === "."){
    let parts = internalExpr.split(/[\+\-\*\/]/);
    let last = parts[parts.length-1];
    if(last.includes(".")) return;
    if(last === ""){
      internalExpr += "0";
      displayExpr  += "0";
    }
  }

  internalExpr += val;
  displayExpr  += val;
  refreshScreen();
}

function addOp(op){
  playClick();
  if(internalExpr === "") return;

  if(/[+\-*/]$/.test(internalExpr)){
    internalExpr = internalExpr.slice(0,-1) + op;
    displayExpr  = displayExpr.slice(0,-1) + (op==="*" ? "×" : op==="/" ? "÷" : op);
  }else{
    internalExpr += op;
    displayExpr  += (op==="*" ? "×" : op==="/" ? "÷" : op);
  }
  refreshScreen();
}

function backspace(){
  playClick();
  internalExpr = internalExpr.slice(0,-1);
  displayExpr  = displayExpr.slice(0,-1);
  refreshScreen();
}

function clearAll(){
  internalExpr = "";
  displayExpr  = "";
  historyBox.textContent = "";
  refreshScreen();
}

function toggleSign(){
  playClick();
  if(internalExpr === "") return;

  // يبدّل إشارة آخر رقم
  let m = internalExpr.match(/(.*?)(-?\d*\.?\d+)\s*$/);
  if(!m) return;
  let head = m[1], num = m[2];
  let newNum = num.startsWith("-") ? num.slice(1) : "-" + num;

  internalExpr = head + newNum;
  displayExpr  = head.replace(/\*/g,"×").replace(/\//g,"÷") + newNum; // تبسيط
  refreshScreen();
}

function percent(){
  playClick();
  if(internalExpr === "") return;

  // يحول آخر رقم إلى رقم/100
  let m = internalExpr.match(/(.*?)(\d*\.?\d+)\s*$/);
  if(!m) return;
  let head = m[1], num = parseFloat(m[2]);
  let val = num / 100;

  internalExpr = head + String(val);
  displayExpr  = (head.replace(/\*/g,"×").replace(/\//g,"÷")) + String(val);
  refreshScreen();
}

// ========= نسخ =========
async function copyText(){
  playClick();
  const t = screen.value || displayExpr || "";
  if(!t) return;
  try{
    await navigator.clipboard.writeText(t);
    historyBox.textContent = "تم النسخ 📋";
    vibe(40);
  }catch{
    historyBox.textContent = "ما كدرت أنسخ 😅";
    vibe(80);
  }
}

// ========= حساب =========
function calculate(){
  playClick();
  let text = internalExpr.trim();
  if(text === "") return;

  // كود سرّي 😭
  if(text === "69"){
    historyBox.textContent = "69 = 😭";
    screen.value = secretMsg;
    return;
  }

  // الضرب (خاص)
  if(text.includes("*")){
    historyBox.textContent = displayExpr;
    screen.value = msgMul;
    vibe(90);
    return;
  }

  try{
    let result = safeCalc(text);
    const showRes = formatNumber(result);
    historyBox.textContent = displayExpr + " = " + showRes;

    if(hasRealSubtraction(text)){
      screen.value = showRes + " — " + msgSub;
      return;
    }
    if(hasDivision(text)){
      screen.value = showRes + " — " + msgDiv;
      return;
    }
    if(hasAddition(text)){
      screen.value = showRes + " — " + msgAdd;
      return;
    }

    screen.value = (person === "younis") ? msgYounis : msgAli;

  }catch(e){
    screen.value = "خطأ 👀";
    vibe(120);
  }
}

// ========= كيبورد + سحب =========
document.addEventListener("keydown", (e)=>{
  if(document.getElementById("calc").classList.contains("hidden")) return;

  const k = e.key;
  if((k >= "0" && k <= "9") || k === "."){ add(k); return; }
  if(k === "+" || k === "-" || k === "*" || k === "/"){ addOp(k); return; }
  if(k === "Enter" || k === "="){ calculate(); return; }
  if(k === "Backspace"){ backspace(); return; }
  if(k.toLowerCase() === "c"){ clearAll(); return; }
});

let touchStartX = null;
document.addEventListener("touchstart", (e)=>{
  if(document.getElementById("calc").classList.contains("hidden")) return;
  touchStartX = e.touches[0].clientX;
},{passive:true});

document.addEventListener("touchend", (e)=>{
  if(touchStartX === null) return;
  const endX = e.changedTouches[0].clientX;
  const dx = endX - touchStartX;
  touchStartX = null;

  // سحب يمين = رجوع
  if(dx > 70){
    backspace();
    vibe(30);
  }
},{passive:true});
</script>

</body>
</html>
